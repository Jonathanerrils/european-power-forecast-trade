name: Generate manuscript PNG figures

on:
  push:
    branches:
      - manuscript/overleaf-draft-v1
    paths:
      - scripts/generate_manuscript_figures.py
      - .github/workflows/generate-manuscript-figures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out manuscript branch
        uses: actions/checkout@v4
        with:
          ref: manuscript/overleaf-draft-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install figure dependencies
        run: python -m pip install --upgrade pip matplotlib pandas numpy

      - name: Generate PNG figures
        run: python scripts/generate_manuscript_figures.py

      - name: Remove obsolete LaTeX figure sources
        run: |
          rm -f manuscript/figures/fig5_workflow.tex
          rm -f manuscript/figures/fig6_timeline.tex
          rm -f manuscript/figures/fig7_holdout_accuracy.tex
          rm -f manuscript/figures/fig8_cumulative_pnl.tex
          rm -f manuscript/figures/fig9_sensitivity.tex

      - name: Commit generated PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/figures
          if git diff --cached --quiet; then
            echo "No figure changes to commit."
          else
            git commit -m "Use PNG assets for manuscript figures 5-9"
            git push origin HEAD:manuscript/overleaf-draft-v1
          fi
