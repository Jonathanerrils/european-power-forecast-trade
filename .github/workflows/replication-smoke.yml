name: Replication smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - submission/doi-replication-final

permissions:
  contents: read

jobs:
  clean-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Run regression tests
        run: python -m pytest tests/ -v

      - name: Run repository integrity checks
        run: python scripts/run_all_checks.py

      - name: Regenerate post-hoc robustness outputs
        run: python scripts/posthoc_robustness_v1.py

      - name: Verify regenerated post-hoc evidence is unchanged
        run: |
          git diff --exit-code -- outputs/posthoc/robustness_v1/
