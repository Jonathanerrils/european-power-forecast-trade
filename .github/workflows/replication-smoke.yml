name: Replication smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - submission/doi-replication-final

permissions:
  contents: read

jobs:
  clean-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Run regression tests
        run: python -m pytest tests/ -v

      - name: Run repository integrity checks
        run: python scripts/run_all_checks.py

      - name: Snapshot committed post-hoc evidence
        run: cp -r outputs/posthoc/robustness_v1 /tmp/posthoc_committed

      - name: Regenerate post-hoc robustness outputs
        run: python scripts/posthoc_robustness_v1.py

      - name: Verify regenerated post-hoc evidence is semantically unchanged
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import numpy as np

          committed = Path("/tmp/posthoc_committed")
          regenerated = Path("outputs/posthoc/robustness_v1")
          files = sorted(p.name for p in committed.glob("*.csv"))

          if not files:
              raise SystemExit("No committed post-hoc CSVs found.")

          for name in files:
              a = pd.read_csv(committed / name)
              b = pd.read_csv(regenerated / name)

              if list(a.columns) != list(b.columns):
                  raise SystemExit(f"{name}: column mismatch")
              if len(a) != len(b):
                  raise SystemExit(f"{name}: row-count mismatch {len(a)} != {len(b)}")

              for col in a.columns:
                  if pd.api.types.is_numeric_dtype(a[col]) and pd.api.types.is_numeric_dtype(b[col]):
                      av = a[col].to_numpy(dtype=float)
                      bv = b[col].to_numpy(dtype=float)
                      if not np.allclose(av, bv, rtol=1e-9, atol=1e-6, equal_nan=True):
                          diff = np.nanmax(np.abs(av - bv))
                          raise SystemExit(f"{name}:{col}: numeric mismatch; max abs diff={diff}")
                  else:
                      if not a[col].fillna("<NA>").astype(str).equals(
                          b[col].fillna("<NA>").astype(str)
                      ):
                          raise SystemExit(f"{name}:{col}: categorical mismatch")

          print(f"Semantic reproduction passed for {len(files)} post-hoc CSV files.")
          PY
