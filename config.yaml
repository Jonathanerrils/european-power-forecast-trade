# =============================================================================
# European Day-Ahead Power Forecast-to-Trade & Tail-Risk System
# Project configuration and operational defaults.
# Frozen experiment specifications may instead be enforced in code/contracts;
# documentation-only sections below identify their authoritative source.
# =============================================================================

project:
  name: "european-power-forecast-trade"
  random_seed: 42

market:
  bidding_zone: "DE-LU"
  # ENTSO-E EIC code for DE-LU bidding zone
  eic_code: "10Y1001A1001A82H"
  timezone_local: "Europe/Berlin"
  timezone_storage: "UTC"

data:
  start_date: "2019-01-01"   # clean post DE/AT bidding-zone split sample
  end_date: null              # null = latest complete month at run time; never partial current month
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  sample_dir: "data/sample"
  cache_dir: "data/raw/cache"

# ENTSO-E document types used (see entsoe_client.py DOCUMENT_TYPES)
entsoe:
  base_url: "https://web-api.tp.entsoe.eu/api"
  token_env_var: "ENTSOE_TOKEN"
  request_timeout_seconds: 60
  max_retries: 5
  retry_backoff_seconds: 2
  chunk_days: 365   # ENTSO-E API limits query windows; fetch in <=1yr chunks

market_design:
  fifteen_min_mtu_start: "2025-10-01"  # SDAC 15-minute market time units

decision:
  # Simulated analyst sits at D-1, before the day-ahead auction clears.
  cutoff_local_time: "11:45"
  cutoff_timezone: "Europe/Berlin"

splits:
  # holdout_start IS operationally read (cfg["splits"]["holdout_start"], by
  # run_eda.py, to exclude 2026 rows from development-sample EDA by default)
  # -- confirmed by direct search before this section was reduced, unlike
  # every other key previously here. Keep this key exact and correct.
  holdout_start: "2026-01-01"
  # DOCUMENTATION ONLY below this point -- confirmed unread by any script
  # (initial_train_end, validation_start, validation_end,
  # rolling_validation_start, rolling_validation_end all previously here had
  # zero references outside this file). The authoritative chronological
  # split architecture (fold_1=2023, fold_2=2024, fold_3=Jan-Sep 2025,
  # regime_stress_test=Oct-Dec 2025, final train through 2026-01-01 via
  # get_final_train_window()) lives in src/splits.py, not here -- those
  # removed keys described an older, simpler split the actual code has
  # since superseded, and duplicating the current architecture here would
  # only risk drifting out of sync again the same way it already had.
  see: "src/splits.py"
  holdout_protocol: "docs/holdout_protocol_v2.md"

features:
  price_lags_hours: [24, 48, 168]
  rolling_windows_hours: [24, 168]

models:
  baselines:
    - lag_24
    - lag_168
    - elasticnet
  challenger: xgboost
  xgboost_param_grid:
    max_depth: [3, 4, 5]
    n_estimators: [200, 400]
    learning_rate: [0.03, 0.05, 0.1]
    subsample: [0.8, 1.0]

uncertainty:
  quantiles: [0.1, 0.5, 0.9]
  # 60 days, selected by a pre-registered sensitivity experiment across
  # [60, 90, 120, 180, 365] candidates (run_uncertainty_sensitivity.py),
  # scored by interval score on a common-row-corrected comparison
  # (every candidate evaluated on the identical n=24,115 rows -- see
  # docs/economic_contract_v2.md and README "Uncertainty quantification").
  # This is the DELIVERY-DAY-SAFE corrected value (information_set_method=
  # "delivery_day_safe", frozen artifact uncertainty_selected_v2_dayorigin) --
  # the original hourly-information-set selection also chose 60 days
  # (uncertainty_selected_v1, kept for the historical record, not deleted),
  # and 180 was an even earlier provisional value (uncertainty_v2). Changing
  # this value again requires a new pre-registered sensitivity run, not an
  # ad hoc edit -- see the "post-result tuning" discipline documented in
  # README Process notes. NOTE: run_uncertainty.py's consequential 3-argument
  # form reads window_days directly from the named sensitivity run's own
  # manifest, not from this config value -- this field is documentation of
  # the current frozen selection, not itself the operational source for a
  # real run.
  residual_window_days: 60

strategy:
  # This section is DOCUMENTATION ONLY -- no script in this repository reads
  # cfg["strategy"] (confirmed by direct search before this note was added).
  # The actual frozen economic parameters live in run_strategy_backtest.py's
  # ETA_RT_PRIMARY / C_PRIMARY constants and are specified authoritatively in
  # docs/economic_contract_v2.md (S0-S5, cost formula, 3x3 grid). An earlier
  # version of this section contained stale, wrong, and unwired values
  # (round_trip_efficiency_base: 0.90, a flat transaction_cost_eur_mwh model)
  # that never matched the actual frozen strategy and risked being mistaken
  # for a competing specification -- removed rather than "fixed," since a
  # value nothing reads should not exist here at all, correct or not.
  see: "docs/economic_contract_v2.md"

risk:
  # DOCUMENTATION ONLY. The frozen development/holdout tail-risk method is
  # empirical historical VaR/ES at 95% and 99%, implemented in
  # run_strategy_tailrisk.py and frozen in docs/holdout_protocol_v2.md.
  # Do not introduce rolling-window or alternative tail-model settings here;
  # they are not part of the frozen experiment. An earlier version of this
  # section contained rolling_window_trading_days and extreme_regime_quantile
  # values that no code reads and that describe a method never actually run
  # -- removed for the same reason strategy: was cleaned up above: an unread
  # config value describing a different method than the one actually frozen
  # is a dormant competing specification, not harmless documentation.
  see: "docs/holdout_protocol_v2.md"

logging:
  level: "INFO"
